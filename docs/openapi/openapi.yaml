openapi: 3.1.0

info:
  title: Reuniva API
  version: 0.1.0
  description: |
    API HTTP para gestão de igrejas. O contrato documenta somente as
    funcionalidades atualmente expostas pela aplicação.

tags:
  - name: Churches
    description: Cadastro e gerenciamento de igrejas.
  - name: Authentication
    description: Verificação de e-mail e gerenciamento de sessões.
  - name: Authorization
    description: Contexto autenticado e autorização no escopo da igreja.

paths:
  /api/v1/auth/verify-email:
    post:
      tags: [Authentication]
      operationId: verifyEmail
      summary: Confirma o endereço de e-mail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '204':
          description: E-mail confirmado e vínculos iniciais ativados.
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '429':
          $ref: '#/components/responses/AuthenticationError'

  /api/v1/auth/verify-email/resend:
    post:
      tags: [Authentication]
      operationId: resendEmailVerification
      summary: Solicita novo e-mail de confirmação
      description: A resposta é neutra e não revela se a conta existe. Tokens anteriores são invalidados.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '204':
          description: Solicitação processada.
        '429':
          $ref: '#/components/responses/AuthenticationError'

  /api/v1/auth/forgot-password:
    post:
      tags: [Authentication]
      operationId: requestPasswordReset
      summary: Solicita recuperação de senha
      description: A resposta é neutra e não revela se a conta existe.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '204':
          description: Solicitação processada.
        '422':
          $ref: '#/components/responses/AuthenticationError'
        '429':
          $ref: '#/components/responses/AuthenticationError'
        '503':
          $ref: '#/components/responses/AuthenticationError'

  /api/v1/auth/reset-password:
    post:
      tags: [Authentication]
      operationId: resetPassword
      summary: Redefine a senha usando token de uso único
      description: O sucesso revoga todas as sessões existentes do usuário.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Senha redefinida e sessões revogadas.
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '422':
          $ref: '#/components/responses/AuthenticationError'
        '429':
          $ref: '#/components/responses/AuthenticationError'

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Cria uma sessão autenticada
      description: Exige e-mail verificado. O refresh token é entregue somente em cookie HttpOnly.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sessão criada.
          headers:
            Set-Cookie:
              description: Refresh token opaco em cookie HttpOnly, SameSite=Lax, Secure em produção e escopo `/api/v1/auth`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthenticationError'
        '422':
          $ref: '#/components/responses/AuthenticationError'
        '429':
          $ref: '#/components/responses/AuthenticationError'
        '503':
          $ref: '#/components/responses/AuthenticationError'

  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshSession
      summary: Rotaciona o refresh token
      description: |
        Reutilizar um refresh token já consumido revoga a sessão associada.
        Requisições de navegador com `Origin` são aceitas somente quando a origem
        pertence à allowlist CORS configurada pela aplicação.
      security:
        - RefreshCookie: []
      responses:
        '200':
          description: Novo par de tokens emitido; o refresh token anterior deixa de ser válido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthenticationError'
        '429':
          $ref: '#/components/responses/AuthenticationError'

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoga a sessão atual
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Sessão revogada e cookie removido.
        '401':
          $ref: '#/components/responses/AuthenticationError'

  /api/v1/auth/logout-all:
    post:
      tags: [Authentication]
      operationId: logoutAllSessions
      summary: Revoga todas as sessões do usuário
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Todas as sessões foram revogadas e o cookie atual foi removido.
        '401':
          $ref: '#/components/responses/AuthenticationError'

  /api/v1/auth/sessions:
    get:
      tags: [Authentication]
      operationId: listUserSessions
      summary: Lista as sessões ativas do usuário
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Sessões ativas e não expiradas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSessionResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'

  /api/v1/auth/sessions/{session_id}:
    delete:
      tags: [Authentication]
      operationId: revokeUserSession
      summary: Revoga uma sessão pertencente ao usuário
      security:
        - BearerAuth: []
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Sessão revogada.
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          $ref: '#/components/responses/AuthenticationError'

  /api/v1/auth/me:
    get:
      tags: [Authorization]
      operationId: getCurrentUser
      summary: Retorna a identidade e os acessos ativos
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Identidade autenticada e acessos segregados por igreja.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'

  /api/v1/auth/change-password:
    post:
      tags: [Authentication]
      operationId: changePassword
      summary: Altera a senha do usuário autenticado
      description: Exige a senha atual e revoga as demais sessões do usuário.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Senha alterada e demais sessões revogadas.
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '422':
          $ref: '#/components/responses/AuthenticationError'
        '429':
          $ref: '#/components/responses/AuthenticationError'

  /api/v1/churches/{church_id}/me:
    get:
      tags: [Authorization]
      operationId: getCurrentUserInChurch
      summary: Retorna o contexto autorizado em uma igreja
      security:
        - BearerAuth: []
      parameters:
        - name: church_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Contexto autorizado com a permissão `church:read`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthenticationError'

  /api/v1/churches:
    post:
      tags:
        - Churches
      operationId: registerChurch
      summary: Cadastra uma igreja
      description: |
        Cadastra a igreja, sua congregação sede, o primeiro administrador,
        o vínculo administrativo e as configurações iniciais em uma transação.

        A igreja e o administrador são criados com verificação de e-mail
        pendente. O endpoint é público, protegido por rate limiting e não é idempotente.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterChurchRequest'
            examples:
              churchRegistration:
                summary: Cadastro de uma igreja e seu administrador
                value:
                  official_name: Igreja Batista Central de Jundiaí
                  display_name: Igreja Batista Central
                  document: 11.222.333/0001-81
                  institutional_email: contato@igreja.com.br
                  institutional_phone: '+5511999999999'
                  website: https://igreja.com.br
                  slug: igreja-central-jundiai
                  timezone: America/Sao_Paulo
                  address:
                    postal_code: 13200-000
                    street: Rua das Igrejas
                    number: '100'
                    complement: null
                    district: Centro
                    city: Jundiaí
                    state: SP
                    country: BR
                  administrator:
                    name: João da Silva
                    email: joao@igreja.com.br
                    phone: '+5511999999999'
                    password: SenhaSegura123
                    password_confirmation: SenhaSegura123
                  terms_accepted: true
                  captcha_token: turnstile-token
      responses:
        '201':
          description: Igreja e estrutura inicial cadastradas com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterChurchResponse'
              examples:
                pendingEmailVerification:
                  summary: Cadastro aguardando verificação de e-mail
                  value:
                    data:
                      church_id: 7a3aa748-53fd-47a9-b54e-429ba5e5405d
                      congregation_id: 069bd8f6-16ee-4d20-b35b-b60b1e5fbb7e
                      administrator_id: 7b29c563-a82f-4ec6-9646-1ed4fba9190d
                      status: pending_email_verification
                      email_verification_required: true
        '409':
          description: E-mail do administrador, slug ou CNPJ já cadastrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationErrorResponse'
              examples:
                administratorEmailAlreadyExists:
                  value:
                    error:
                      code: USER_EMAIL_ALREADY_EXISTS
                      message: Já existe uma conta cadastrada com este e-mail.
                churchSlugAlreadyExists:
                  value:
                    error:
                      code: CHURCH_SLUG_ALREADY_EXISTS
                      message: O endereço público escolhido já está em uso.
                churchDocumentAlreadyExists:
                  value:
                    error:
                      code: CHURCH_DOCUMENT_ALREADY_EXISTS
                      message: Já existe uma igreja cadastrada com este CNPJ.
        '422':
          description: |
            Corpo incompatível com o contrato ou dados rejeitados pelas regras
            de cadastro e pelos tipos de domínio.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RequestValidationErrorResponse'
                  - $ref: '#/components/schemas/RegistrationErrorResponse'
                  - $ref: '#/components/schemas/AuthenticationErrorResponse'
              examples:
                unknownField:
                  summary: Campo não permitido no corpo
                  value:
                    detail:
                      - type: extra_forbidden
                        loc:
                          - body
                          - is_platform_admin
                        msg: Extra inputs are not permitted
                        input: true
                termsNotAccepted:
                  summary: Termos não aceitos
                  value:
                    error:
                      code: TERMS_NOT_ACCEPTED
                      message: O aceite dos termos é necessário.
                invalidDomainField:
                  summary: Campo rejeitado pelo domínio
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: O slug informado possui formato inválido.
                      fields:
                        slug:
                          - O slug informado possui formato inválido.
        '503':
          $ref: '#/components/responses/AuthenticationError'
        '429':
          $ref: '#/components/responses/AuthenticationError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    RefreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token

  responses:
    AuthenticationError:
      description: Falha de autenticação ou autorização.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthenticationErrorResponse'

  schemas:
    VerifyEmailRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 128
          description: Token opaco, de uso único e com validade de 24 horas.

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password, captcha_token]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
          writeOnly: true
        captcha_token:
          type: string
          minLength: 1
          maxLength: 2048
          writeOnly: true
          description: Token de uso único emitido pelo Cloudflare Turnstile para a action `login`.

    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254

    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [email, captcha_token]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        captcha_token:
          type: string
          minLength: 1
          maxLength: 2048
          writeOnly: true
          description: Token de uso único emitido pelo Cloudflare Turnstile para a action `password_recovery`.

    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, new_password]
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 128
        new_password:
          type: string
          format: password
          minLength: 10
          maxLength: 128
          writeOnly: true

    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
          writeOnly: true
        new_password:
          type: string
          format: password
          minLength: 10
          maxLength: 128
          writeOnly: true

    AccessTokenResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: JWT assinado com validade padrão de 15 minutos.
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          const: 900

    UserSessionResponse:
      type: object
      additionalProperties: false
      required: [session_id, created_at, expires_at, current]
      properties:
        session_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        current:
          type: boolean

    CurrentUserResponse:
      type: object
      additionalProperties: false
      required: [user_id, name, email, churches]
      properties:
        user_id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        churches:
          type: array
          items:
            $ref: '#/components/schemas/ChurchAccessResponse'

    ChurchAccessResponse:
      type: object
      additionalProperties: false
      required: [church_id, role, permissions]
      properties:
        church_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [church_owner, church_admin, pastor, secretary, treasurer, leader, member]
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: '^[a-z_]+:[a-z_]+$'

    AuthenticationErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - AUTH_EMAIL_VERIFICATION_TOKEN_INVALID
                - AUTH_INVALID_CREDENTIALS
                - AUTH_EMAIL_NOT_VERIFIED
                - AUTH_ACCESS_TOKEN_INVALID
                - AUTH_REFRESH_TOKEN_INVALID
                - AUTH_SESSION_REVOKED
                - AUTH_PERMISSION_DENIED
                - AUTH_CHURCH_ACCESS_DENIED
                - AUTH_SESSION_NOT_FOUND
                - AUTH_RATE_LIMIT_EXCEEDED
                - AUTH_PASSWORD_RESET_TOKEN_INVALID
                - AUTH_PASSWORD_INVALID
                - HUMAN_CHALLENGE_FAILED
                - HUMAN_CHALLENGE_UNAVAILABLE
            message:
              type: string
              minLength: 1

    RegisterChurchRequest:
      type: object
      additionalProperties: false
      required:
        - official_name
        - display_name
        - institutional_email
        - institutional_phone
        - slug
        - timezone
        - address
        - administrator
        - terms_accepted
        - captcha_token
      properties:
        official_name:
          type: string
          minLength: 3
          maxLength: 150
          description: Nome oficial; espaços consecutivos são normalizados.
          example: Igreja Batista Central de Jundiaí
        display_name:
          type: string
          minLength: 2
          maxLength: 100
          description: Nome curto usado para exibição; espaços são normalizados.
          example: Igreja Batista Central
        document:
          anyOf:
            - type: string
              maxLength: 18
            - type: 'null'
          description: CNPJ opcional. A aplicação remove caracteres não numéricos e valida os dígitos verificadores.
          examples:
            - 11.222.333/0001-81
            - null
        institutional_email:
          type: string
          maxLength: 254
          pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
          description: E-mail institucional, normalizado para letras minúsculas.
          example: contato@igreja.com.br
        institutional_phone:
          type: string
          maxLength: 32
          description: Telefone com código do país; a representação persistida usa de 8 a 15 dígitos no formato E.164.
          example: '+5511999999999'
        website:
          anyOf:
            - type: string
              maxLength: 2048
            - type: 'null'
          description: Endereço web institucional opcional.
          example: https://igreja.com.br
        slug:
          type: string
          minLength: 3
          maxLength: 60
          pattern: '^[A-Za-z0-9]+(?:-[A-Za-z0-9]+)*$'
          description: |
            Endereço público único da igreja. A entrada aceita letras maiúsculas,
            mas é normalizada para minúsculas antes da verificação de unicidade e
            não pode ser uma palavra reservada pela aplicação.
          example: igreja-central-jundiai
        timezone:
          type: string
          maxLength: 64
          description: Identificador de fuso horário reconhecido pelo banco IANA instalado no servidor.
          example: America/Sao_Paulo
        address:
          $ref: '#/components/schemas/AddressRequest'
        administrator:
          $ref: '#/components/schemas/AdministratorRequest'
        terms_accepted:
          type: boolean
          const: true
          description: Confirmação obrigatória do aceite dos termos.
        captcha_token:
          type: string
          minLength: 1
          maxLength: 2048
          writeOnly: true
          description: Token de uso único emitido pelo Cloudflare Turnstile para a action `registration`.

    AddressRequest:
      type: object
      additionalProperties: false
      required:
        - postal_code
        - street
        - number
        - district
        - city
        - state
        - country
      properties:
        postal_code:
          type: string
          minLength: 1
          maxLength: 16
          description: Código postal do endereço da congregação sede.
          example: 13200-000
        street:
          type: string
          minLength: 1
          maxLength: 200
          description: Logradouro da congregação sede.
          example: Rua das Igrejas
        number:
          type: string
          minLength: 1
          maxLength: 30
          description: Número ou identificação do imóvel.
          example: '100'
        complement:
          anyOf:
            - type: string
              maxLength: 100
            - type: 'null'
          description: Complemento opcional do endereço.
          example: Sala 2
        district:
          type: string
          minLength: 1
          maxLength: 100
          description: Bairro da congregação sede.
          example: Centro
        city:
          type: string
          minLength: 1
          maxLength: 100
          description: Cidade da congregação sede.
          example: Jundiaí
        state:
          type: string
          minLength: 1
          maxLength: 50
          description: Estado, província ou divisão administrativa equivalente.
          example: SP
        country:
          type: string
          minLength: 1
          maxLength: 2
          description: País do endereço.
          example: BR

    AdministratorRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - email
        - phone
        - password
        - password_confirmation
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
          description: Nome do primeiro administrador; espaços consecutivos são normalizados.
          example: João da Silva
        email:
          type: string
          maxLength: 254
          pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
          description: E-mail único do administrador, normalizado para letras minúsculas.
          example: joao@igreja.com.br
        phone:
          type: string
          maxLength: 32
          description: Telefone com código do país; a representação persistida usa de 8 a 15 dígitos no formato E.164.
          example: '+5511999999999'
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 128
          writeOnly: true
          description: Senha com ao menos 10 caracteres e diferente do e-mail.
          example: SenhaSegura123
        password_confirmation:
          type: string
          format: password
          minLength: 10
          maxLength: 128
          writeOnly: true
          description: Repetição exata do campo `password`.
          example: SenhaSegura123

    RegisterChurchResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/RegisterChurchData'

    RegisterChurchData:
      type: object
      additionalProperties: false
      required:
        - church_id
        - congregation_id
        - administrator_id
        - status
        - email_verification_required
      properties:
        church_id:
          type: string
          format: uuid
          description: Identificador da igreja criada.
        congregation_id:
          type: string
          format: uuid
          description: Identificador da congregação sede criada.
        administrator_id:
          type: string
          format: uuid
          description: Identificador do primeiro administrador.
        status:
          $ref: '#/components/schemas/ChurchStatus'
        email_verification_required:
          type: boolean
          const: true
          description: Indica que a verificação do e-mail é necessária para concluir a ativação.

    ChurchStatus:
      type: string
      description: Estado inicial da igreja cadastrada.
      enum:
        - pending_email_verification

    RegistrationErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/RegistrationError'

    RegistrationError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - REGISTRATION_ERROR
            - TERMS_NOT_ACCEPTED
            - PASSWORD_MISMATCH
            - WEAK_PASSWORD
            - USER_EMAIL_ALREADY_EXISTS
            - CHURCH_SLUG_ALREADY_EXISTS
            - CHURCH_DOCUMENT_ALREADY_EXISTS
            - VALIDATION_ERROR
          description: Código estável do erro de cadastro.
        message:
          type: string
          minLength: 1
          description: Mensagem legível com o motivo da rejeição.
        fields:
          $ref: '#/components/schemas/FieldErrors'

    FieldErrors:
      type: object
      description: Erros agrupados pelo nome externo do campo.
      additionalProperties:
        type: array
        minItems: 1
        items:
          type: string
          minLength: 1

    RequestValidationErrorResponse:
      type: object
      additionalProperties: false
      required:
        - detail
      properties:
        detail:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RequestValidationError'

    RequestValidationError:
      type: object
      additionalProperties: false
      required:
        - type
        - loc
        - msg
      properties:
        type:
          type: string
          minLength: 1
          description: Identificador do tipo de falha produzido pelo validador.
        loc:
          type: array
          minItems: 1
          items:
            oneOf:
              - type: string
              - type: integer
        msg:
          type: string
          minLength: 1
          description: Descrição da falha de validação.
        input:
          $ref: '#/components/schemas/JsonValue'
        ctx:
          $ref: '#/components/schemas/JsonObject'
        url:
          type: string
          format: uri

    JsonValue:
      description: Valor recebido pelo validador, preservado no erro automático do framework.
      anyOf:
        - type: 'null'
        - type: boolean
        - type: integer
        - type: number
        - type: string
        - type: array
          items:
            $ref: '#/components/schemas/JsonValue'
        - $ref: '#/components/schemas/JsonObject'

    JsonObject:
      type: object
      description: Objeto JSON recebido ou produzido pelo contexto do validador.
      additionalProperties:
        $ref: '#/components/schemas/JsonValue'
