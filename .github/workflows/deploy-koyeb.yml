name: Deploy to Koyeb

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read

concurrency:
  group: koyeb-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy merged main revision
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'develop'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Install and configure Koyeb CLI
        uses: koyeb-community/koyeb-actions@969e180512fa08ddac5231e2f78c8fb025fd5db7
        with:
          api_token: ${{ secrets.KOYEB_API_TOKEN }}

      - name: Deploy main revision
        uses: koyeb/action-git-deploy@e40b6fc5ae0707b7fff3a940d4b357b5c7d9dbae
        with:
          app-name: reuniva-api
          service-name: api
          git-url: github.com/${{ github.repository }}
          git-branch: main
          git-sha: ${{ github.event.pull_request.merge_commit_sha }}
          git-builder: docker
          git-docker-dockerfile: Dockerfile
          service-env: APP_ENV=development,PERSISTENCE_BACKEND=memory
          service-instance-type: nano
          service-regions: was
          service-ports: "8000:http"
          service-routes: "/:8000"
          service-checks: "8000:http:/health"
          service-checks-grace-period: "8000=10"
